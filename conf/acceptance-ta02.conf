; TA-02: quatro VMs CPU-bound com chegadas distintas.
[host]
pcpus = 1
max_vms = 4
max_ticks = 1000
seed = 2026
[sched]
policy = SJF
quantum = 4
[mem]
model = PAG
phys_words = 4096
page_words = 64
replacement = LRU
repl_scope = GLOBAL
pf_penalty = 3
[io]
disk_algorithm = C_LOOK
disk_cylinders = 200
disk_head = 50
seek_rate = 25
[log]
format = CSV
level = INFO
file = out/acceptance-ta02.csv
[ext]
enabled = false
limit = 200
[vm]
name = cpu0
program = progs/cpu_bound.mv
arrival = 0
priority = 5
mem_words = 256
[vm]
name = cpu1
program = progs/cpu_bound.mv
arrival = 1
priority = 5
mem_words = 256
[vm]
name = cpu2
program = progs/cpu_bound.mv
arrival = 2
priority = 5
mem_words = 256
[vm]
name = cpu3
program = progs/cpu_bound.mv
arrival = 3
priority = 5
mem_words = 256
