; Configuração de exemplo para comparar FCFS com os mesmos programas do escopo 02.
[host]
pcpus = 1
max_vms = 4
max_ticks = 5000
seed = 2026
[sched]
policy = FCFS
quantum = 4
[mem]
model = PAG
phys_words = 4096
page_words = 64
replacement = LRU
repl_scope = GLOBAL
pf_penalty = 3
[io]
disk_algorithm = C_LOOK
disk_cylinders = 200
disk_head = 50
seek_rate = 25
[log]
format = CSV
level = INFO
file = out/minihv-fcfs.csv
[ext]
enabled = true
limit = 200
[vm]
name = web
program = progs/contador.mv
arrival = 0
priority = 2
mem_words = 256
[vm]
name = io_worker
program = progs/io_mix.mv
arrival = 1
priority = 5
mem_words = 256
[vm]
name = memory_worker
program = progs/memory_sweep.mv
arrival = 2
priority = 1
mem_words = 8192
[vm]
name = guard
program = progs/protection_fault.mv
arrival = 3
priority = 4
mem_words = 256
