; TA-03: CPU, CONSOLE, DISK and NET I/O in a mixed workload.
[host]
pcpus = 1
max_vms = 4
max_ticks = 1000
seed = 2026
[sched]
policy = SJF
[mem]
model = PAG
phys_words = 4096
page_words = 64
replacement = LRU
repl_scope = GLOBAL
pf_penalty = 3
[io]
disk_algorithm = C_LOOK
disk_cylinders = 200
disk_head = 50
seek_rate = 25
[log]
format = CSV
level = INFO
file = out/acceptance-ta03.csv
[ext]
enabled = true
limit = 200
[vm]
name = io_worker
program = progs/io_mix.mv
arrival = 0
priority = 5
mem_words = 256
[vm]
name = counter
program = progs/contador.mv
arrival = 1
priority = 5
mem_words = 256
