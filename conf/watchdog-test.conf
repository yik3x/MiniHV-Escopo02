; Configuração curta para validar WATCHDOG sem esperar 400 ticks.
[host]
pcpus = 1
max_vms = 4
max_ticks = 500
seed = 2026
[sched]
policy = SJF
quantum = 4
[mem]
model = PAG
phys_words = 4096
page_words = 64
replacement = LRU
repl_scope = GLOBAL
pf_penalty = 3
[io]
disk_algorithm = C_LOOK
disk_cylinders = 200
disk_head = 50
seek_rate = 25
[log]
format = CSV
level = DEBUG
file = out/watchdog-test.csv
[ext]
enabled = true
limit = 5
[vm]
name = infinite
program = progs/watchdog.mv
arrival = 0
priority = 5
mem_words = 128
[vm]
name = counter
program = progs/contador.mv
arrival = 1
priority = 5
mem_words = 128
