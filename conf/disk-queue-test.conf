; Teste C-LOOK: primeira requisição no cilindro 20; as demais ficam pendentes.
[host]
pcpus = 1
max_vms = 4
max_ticks = 1000
seed = 2026
[sched]
policy = SJF
quantum = 4
[mem]
model = PAG
phys_words = 4096
page_words = 64
replacement = LRU
repl_scope = GLOBAL
pf_penalty = 3
[io]
disk_algorithm = C_LOOK
disk_cylinders = 200
disk_head = 50
seek_rate = 25
[log]
format = CSV
level = DEBUG
file = out/disk-queue-test.csv
[ext]
enabled = true
limit = 200
[vm]
name = disk20
program = progs/disk20.mv
arrival = 0
priority = 5
mem_words = 128
