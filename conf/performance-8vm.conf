; Performance regression only; max_vms=8 intentionally overrides the Scope 02 default for RNF-05 stress testing.
[host]
pcpus = 1
max_vms = 8
max_ticks = 10000
seed = 2026

[sched]
policy = SJF
quantum = 4

[mem]
model = PAG
phys_words = 4096
page_words = 64
replacement = LRU
repl_scope = GLOBAL
pf_penalty = 3

[io]
disk_algorithm = C_LOOK
disk_cylinders = 200
disk_head = 50
seek_rate = 25

[log]
format = CSV
level = ERROR
file = out/performance-8vm.csv

[ext]
enabled = false
limit = 200

[vm]
name = perf0
program = progs/perf_io_loop.mv
arrival = 0
priority = 5
mem_words = 64

